# Hive configuration
# Place at: ~/.config/hive/config.yaml

# Global settings
repos_dir: ~/repos              # Directory to scan for repos

# Serve the backlog over HTTP alongside the TUI, so it can be read and reviewed
# from a phone. 0 or absent is off. The URL is printed on start.
# There is no authentication: anyone who can reach the port can read every
# backlog and plan, and can approve or reject work. Binds 0.0.0.0 so a tailnet
# address works, which means any network this machine joins can reach it too.
# Do not expose this to the internet.
web_port: 8787
scratch_dir: /tmp/hive-scratch  # Where scratch instances are created
default_action: claude           # "claude" (start claude on open) or "shell" (just a shell)

# Notification settings
notifications:
  desktop: true                  # Send desktop notifications for high-severity events
  tab_flash: true                # Flash tabs on alerts
  poll_interval: 5               # Seconds between health checks

# Per-workspace overrides
# Session telemetry — answers one question per session: hand the work off so it
# gets picked up elsewhere, or keep going. Every threshold is a ratio, so none
# of this goes stale when model prices change.
telemetry:
  enabled: true
  wrapup_at_pct: 50        # context this full -> finish what is in flight
  handoff_at_pct: 70       # context this full -> move the work; compaction looms
  wrapup_growth: 6         # turns costing this many times a fresh session
  wrapup_at_cost_usd: 50   # spent this much -> finish up. The only rule that counts
                           # turns: a session can hold a steady context percentage
                           # for hundreds of turns, re-reading it every time, and
                           # trip none of the rules above. 0 disables.
  handoff_at_cost_usd: 120 # spent this much -> move the work. Cost is cumulative
                           # and includes subagents, so it also catches a session
                           # that delegates everything and stays near-empty. 0 disables.
  cold_growth: 5           # how big a cache-cold session must be to be worth moving
  park_at_pct: 90          # 5-hour quota; a fleet-wide override, not a per-session input
  rate_limit_floor_pct: 60 # only show the shared 5h window once it is worth knowing
  cache_ttl_minutes: 60    # assumed prompt-cache TTL; drops to 5 under usage overage
  stale_after_seconds: 30  # no report in this long -> render grey, not a stale verdict
  prune_after_hours: 24    # delete snapshots older than this

# Key = directory name inside repos_dir
# All fields are optional — unconfigured repos use defaults
workspaces:
  my-project:
    name: "My Project"           # Display name in TUI list
    short: "MP"                  # Short name for tab title
    color: "#ff6b6b"             # Tab color (hex)
    remote: true                 # Auto-start claude remote-control session
    favourite: true              # Pin to favourites section
    # yolo: true                 # Start claude with bypassPermissions
    # worktree_init: true        # Run this repo's scripts/wt-init.sh in each new
                                 # worktree before claude starts. Off by default:
                                 # it executes a script the repo controls, so it
                                 # is opt-in per workspace. Toggle it with E.
    # build_concurrency: 3       # How many /build workers run at once. Each holds
                                 # a worktree and a branch, and each one lands in
                                 # your triage queue — so raise it only as fast as
                                 # you are willing to read the results.
    # refine_concurrency: 1      # How many /refine planners run at once. A planner
                                 # is not one agent — it fans out to context
                                 # loaders and a critic of its own, so even one
                                 # planner is about five agents. Raise it only
                                 # once you know what one ticket costs.
  another-app:
    name: "Another App"
    short: "AA"
    color: "#0088cc"
    remote: true
    favourite: true
  side-project:
    name: "Side Project"
    short: "SP"
    color: "#c792ea"
    favourite: true
